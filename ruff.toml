# Ruff runs as a pre-commit hook to catch bugs, not to have opinions about
# style. Undefined names are the target: they live in main(), which no unit
# test can reach, and they surface only when someone scrolls the running page.

[lint]
# F  - pyflakes: undefined names, unused imports, f-strings missing placeholders
# E9 - syntax and IO errors that stop the file running at all
#
# No style rules, deliberately. Line length, quote style and import order are
# not what goes wrong here, and a hook that argues about them is a hook that
# gets bypassed with --no-verify.
select = ["F", "E9"]

[lint.per-file-ignores]
# Debug scripts are scratch by definition.
"debug/*" = ["F401"]
