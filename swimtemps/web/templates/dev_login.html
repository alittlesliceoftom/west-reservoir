{% extends "base.html" %}
{% block title %}Development sign-in - swimtemps{% endblock %}
{% block main %}
<h1>Development sign-in</h1>
<p class="note">This server is in development mode. Google sign-in is replaced by this form; any email works.</p>
<form method="post" action="/auth/dev-login" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Email <input type="email" name="email" required autocomplete="email"></label>
  <label>Name <input type="text" name="name" autocomplete="name"></label>
  <button class="primary" type="submit">Sign in</button>
</form>
{% endblock %}
